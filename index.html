<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
</head>
<body>
    <div id="container">
        <div class="body-el">
            <h1>Unit Converter</h1><br>
            <input type="text" id="input-el"><br>
            <button id="convert-btn">CONVERT</button><br>
            <button id="reset-btn">RESET</button><br>
        </div>
        <div class="length-el">
            <h2>Length (Meter/Feet)</h2>
            <p id="length-el"></p>
        </div>
        <div class="volume-el">
            <h2>Volume (liter/gallons)</h2>
            <p id="volume-el"></p><br>
        </div>
        <div class="weight-el">
            <h2>Weight (kilogram/pounds)</h2>
            <p id="weight-el"></p>
        </div>
        
        
    </div>
    
    <script src="script.js"></script>
</body>
</html>
